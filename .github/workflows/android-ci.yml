name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 打 tag 时要往 Release 传 APK，需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      # 仓库里 wrapper 指向腾讯镜像（国内快），但 GitHub runner 在国外访问它反而慢，
      # 这里临时换成官方源。
      - name: Gradle 换官方源
        run: |
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle/#services.gradle.org/distributions/#g' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 正式签名密钥走 Secret（base64 存储），落盘到 runner 临时目录。
      # 没有配 Secret 时给出明确报错，而不是静默产出 debug 签名的包。
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret KEYSTORE_BASE64，无法进行正式签名"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验签名并输出摘要
        run: |
          APK=app/build/outputs/apk/release/Shiftcla.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)
          echo "== 签名证书 =="
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK"
          echo "== 文件摘要 =="
          sha256sum "$APK"

      - name: 上传 APK 为工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: Shiftcla-apk
          path: app/build/outputs/apk/release/Shiftcla.apk
          if-no-files-found: error

      # 打 tag（v1.0 这种）时才发 Release；普通提交只产出 artifact。
      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/Shiftcla.apk
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$APK" \
              --title "Shiftcla ${GITHUB_REF_NAME}" --generate-notes
          fi
